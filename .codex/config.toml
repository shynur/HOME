model_provider = "aicodemirror"
model = "gpt-5.4"
model_reasoning_effort = "xhigh"
disable_response_storage = true
preferred_auth_method = "apikey"
approvals_reviewer = "guardian_subagent"
approval_policy = "on-request"
sandbox_mode = "workspace-write"
service_tier = "fast"

[model_providers.aicodemirror]
name = "aicodemirror"
base_url = "https://api.aicodemirror.com/api/codex/backend-api/codex"
wire_api = "responses"

[features]
multi_agent = true
guardian_approval = true
js_repl = true

[notice]
hide_full_access_warning = true

[tui]
status_line = ["model-with-reasoning", "current-dir", "git-branch", "context-used", "total-input-tokens", "total-output-tokens", "fast-mode"]

[projects."/root/ws/HOME"]
trust_level = "trusted"

[[skills.config]]
path = "/root/.codex/skills/.system/openai-docs/SKILL.md"
enabled = false
